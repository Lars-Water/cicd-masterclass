name: PR Validation

on:
    pull_request:
        paths:
            - slides.md
            - components/**
            - pages/**
            - snippets/**
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml

concurrency:
    group: pr-validation-${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build Slidev
              run: pnpm run build

