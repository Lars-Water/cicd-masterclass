name: PR Validation

on:
    pull_request:
        paths:
            - slides.md
            - components/**
            - pages/**
            - snippets/**
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml

concurrency:
    group: pr-validation-${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Run Markdownlint
              uses: nosborn/github-action-markdown-cli@508d6cefd8f0cc99eab5d2d4685b1d5f470042c1 # v3.5.0
              with:
                  files: '**/*.md'
                  config_file: .markdownlint.json

    build:
        needs: lint
        outputs:
            slide-count: ${{ steps.slide-count.outputs.count }}
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Set up pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: 9

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 24

            - name: Resolve pnpm store path
              id: pnpm-store
              run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - name: Cache pnpm store
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build Slidev
              run: pnpm run build

            - name: Count slides
              id: slide-count
              run: echo "count=$(grep -c '^---$' slides.md)" >> "$GITHUB_OUTPUT"

            - name: Upload build artifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: slidev-dist
                  path: dist
                  retention-days: 7

    summary:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Report validation summary
              run: echo "Build completed with ${{ needs.build.outputs.slide-count }} slides"

